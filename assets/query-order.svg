<svg xmlns="http://www.w3.org/2000/svg" width="790" height="760" viewBox="0 0 790 760" role="img" aria-labelledby="title"><title id="title">Conceptual SQL clause processing order</title><rect width="100%" height="100%" fill="#f4f7fb"/><style>text {font-family:Arial,sans-serif;fill:#17263c} .heading {font-size:26px;font-weight:700} .label {font-size:18px;font-weight:700} .small {font-size:16px}</style><text x="28" y="43" class="heading">SQL logical processing order</text><text x="28" y="74" class="small">Write SELECT first; understand how the result is built. Physical plans may differ.</text><rect x="28" y="104" width="730" height="66" rx="10" fill="white" stroke="#cbd5e1"/><text x="44" y="129" class="label">1 · FROM / JOIN</text><text x="44" y="154" class="small">Build input rows and matching pairs</text><rect x="28" y="183" width="730" height="66" rx="10" fill="white" stroke="#cbd5e1"/><text x="44" y="208" class="label">2 · WHERE</text><text x="44" y="233" class="small">Keep rows where the condition is TRUE</text><rect x="28" y="262" width="730" height="66" rx="10" fill="white" stroke="#cbd5e1"/><text x="44" y="287" class="label">3 · GROUP BY</text><text x="44" y="312" class="small">Build groups for aggregate calculations</text><rect x="28" y="341" width="730" height="66" rx="10" fill="white" stroke="#cbd5e1"/><text x="44" y="366" class="label">4 · HAVING</text><text x="44" y="391" class="small">Keep groups meeting a condition</text><rect x="28" y="420" width="730" height="66" rx="10" fill="white" stroke="#cbd5e1"/><text x="44" y="445" class="label">5 · SELECT / windows</text><text x="44" y="470" class="small">Compute output expressions and window values</text><rect x="28" y="499" width="730" height="66" rx="10" fill="white" stroke="#cbd5e1"/><text x="44" y="524" class="label">6 · DISTINCT</text><text x="44" y="549" class="small">Remove duplicate output rows when requested</text><rect x="28" y="578" width="730" height="66" rx="10" fill="white" stroke="#cbd5e1"/><text x="44" y="603" class="label">7 · ORDER BY</text><text x="44" y="628" class="small">Sort the result</text><rect x="28" y="657" width="730" height="66" rx="10" fill="white" stroke="#cbd5e1"/><text x="44" y="682" class="label">8 · LIMIT / OFFSET</text><text x="44" y="707" class="small">Return the requested portion</text></svg>
