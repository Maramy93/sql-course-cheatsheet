<svg xmlns="http://www.w3.org/2000/svg" width="890" height="625" viewBox="0 0 890 625" role="img" aria-labelledby="title"><title id="title">Four table shop schema with one to many relationships</title><rect width="100%" height="100%" fill="#f4f7fb"/><style>text {font-family:Arial,sans-serif;fill:#17263c} .heading {font-size:26px;font-weight:700} .label {font-size:18px;font-weight:700} .small {font-size:16px}</style><text x="30" y="43" class="heading">Harbor Shop · table relationships</text><text x="30" y="73" class="small">One customer can place many orders. Items connect orders to products.</text><rect x="30" y="110" width="320" height="185" rx="12" fill="white" stroke="#cbd5e1"/><path d="M42,110h296q12,0 12,12v32H30V122q0,-12 12,-12" fill="#147a87"/><text x="46" y="139" class="label" style="fill:white">customers</text><text x="46" y="182" class="small">PK customer_id</text><text x="46" y="207" class="small">name, email, city</text><text x="46" y="232" class="small">signup_date, active</text><rect x="520" y="110" width="320" height="185" rx="12" fill="white" stroke="#cbd5e1"/><path d="M532,110h296q12,0 12,12v32H520V122q0,-12 12,-12" fill="#147a87"/><text x="536" y="139" class="label" style="fill:white">orders</text><text x="536" y="182" class="small">PK order_id</text><text x="536" y="207" class="small">FK customer_id</text><text x="536" y="232" class="small">order_date, status</text><rect x="30" y="355" width="320" height="185" rx="12" fill="white" stroke="#cbd5e1"/><path d="M42,355h296q12,0 12,12v32H30V367q0,-12 12,-12" fill="#147a87"/><text x="46" y="384" class="label" style="fill:white">products</text><text x="46" y="427" class="small">PK product_id</text><text x="46" y="452" class="small">product_name, category</text><text x="46" y="477" class="small">price = current price</text><rect x="520" y="355" width="320" height="185" rx="12" fill="white" stroke="#cbd5e1"/><path d="M532,355h296q12,0 12,12v32H520V367q0,-12 12,-12" fill="#147a87"/><text x="536" y="384" class="label" style="fill:white">order_items</text><text x="536" y="427" class="small">PK (order_id, product_id)</text><text x="536" y="452" class="small">FK order_id / FK product_id</text><text x="536" y="477" class="small">quantity, unit_price = sale price</text><path d="M350 190H520 M680 295V355 M350 440H520" fill="none" stroke="#147a87" stroke-width="3"/><text x="375" y="175" class="small">1 → many</text><text x="696" y="326" class="small">1 → many</text><text x="375" y="425" class="small">1 → many</text><text x="30" y="590" class="small">PK = primary key · FK = foreign key · no course database is required</text></svg>
