>score</text><path d="M494,603H882" stroke="#cbd5e1"/><text x="496" y="629" class="small">1</text><text x="586" y="629" class="small">Ada</text><text x="696" y="629" class="small">NULL</text><text x="791" y="629" class="small">NULL</text><text x="496" y="658" class="small">2</text><text x="586" y="658" class="small">Ben</text><text x="696" y="658" class="small">2</text><text x="791" y="658" class="small">90</text><text x="496" y="687" class="small">NULL</text><text x="586" y="687" class="small">NULL</text><text x="696" y="687" class="small">3</text><text x="791" y="687" class="small">80</text><text x="28" y="785" class="small">If one key matches several rows, the join returns every matching pair.</text></svg>
