<svg xmlns="http://www.w3.org/2000/svg" width="930" height="820" viewBox="0 0 930 820" role="img" aria-labelledby="title"><title id="title">Inner left right and full joins illustrated with actual input and output rows</title><rect width="100%" height="100%" fill="#f4f7fb"/><style>text {font-family:Arial,sans-serif;fill:#17263c} .heading {font-size:26px;font-weight:700} .label {font-size:18px;font-weight:700} .small {font-size:16px}</style><text x="28" y="42" class="heading">SQL joins · which rows appear in the result?</text><text x="28" y="74" class="small">Match A.id = B.id. A has IDs 1, 2; B has IDs 2, 3. Each ID occurs once here.</text><rect x="28" y="105" width="280" height="160" rx="12" fill="white" stroke="#cbd5e1"/><path d="M40,105h256q12,0 12,12v32H28V117q0,-12 12,-12" fill="#147a87"/><text x="44" y="134" class="label" style="fill:white">Input A · id, label</text><text x="44" y="177" class="small">1  |  Ada</text><text x="44" y="202" class="small">2  |  Ben</text><rect x="340" y="105" width="280" height="160" rx="12" fill="white" stroke="#cbd5e1"/><path d="M352,105h256q12,0 12,12v32H340V117q0,-12 12,-12" fill="#147a87"/><text x="356" y="134" class="label" style="fill:white">Input B · id, score</text><text x="356" y="177" class="small">2  |  90</text><text x="356" y="202" class="small">3  |  80</text><rect x="28" y="295" width="420" height="200" rx="12" fill="white" stroke="#cbd5e1"/><path d="M40,295h396q12,0 12,12v32H28V307q0,-12 12,-12" fill="#147a87"/><text x="44" y="324" class="label" style="fill:white">INNER</text><text x="46" y="366" class="label">A.id</text><text x="136" y="366" class="label">label</text><text x="246" y="366" class="label">B.id</text><text x="341" y="366" class="label">score</text><path d="M44,378H432" stroke="#cbd5e1"/><text x="46" y="404" class="small">2</text><text x="136" y="404" class="small">Ben</text><text x="246" y="404" class="small">2</text><text x="341" y="404" class="small">90</text><rect x="478" y="295" width="420" height=