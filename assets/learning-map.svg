<svg xmlns="http://www.w3.org/2000/svg" width="950" height="520" viewBox="0 0 950 520" role="img" aria-labelledby="title"><title id="title">SQL tutorial learning map</title><rect width="100%" height="100%" fill="#f4f7fb"/><style>text {font-family:Arial,sans-serif;fill:#17263c} .heading {font-size:26px;font-weight:700} .label {font-size:18px;font-weight:700} .small {font-size:16px}</style><text x="32" y="45" class="heading">SQL: from your first query to interview review</text><text x="32" y="76" class="small">An original PostgreSQL study path · Harbor Shop practice database</text><rect x="32" y="110" width="420" height="170" rx="12" fill="white" stroke="#cbd5e1"/><path d="M44,110h396q12,0 12,12v32H32V122q0,-12 12,-12" fill="#147a87"/><text x="48" y="139" class="label" style="fill:white">1 · Understand</text><text x="48" y="182" class="small">Database, table, row, column</text><text x="48" y="207" class="small">Keys and relationships</text><text x="48" y="232" class="small">Server vs client</text><rect x="482" y="110" width="420" height="170" rx="12" fill="white" stroke="#cbd5e1"/><path d="M494,110h396q12,0 12,12v32H482V122q0,-12 12,-12" fill="#147a87"/><text x="498" y="139" class="label" style="fill:white">2 · Query</text><text x="498" y="182" class="small">SELECT and WHERE</text><text x="498" y="207" class="small">NULL, sorting, patterns</text><text x="498" y="232" class="small">GROUP BY and HAVING</text><rect x="32" y="305" width="420" height="170" rx="12" fill="white" stroke="#cbd5e1"/><path d="M44,305h396q12,0 12,12v32H32V317q0,-12 12,-12" fill="#147a87"/><text x="48" y="334" class="label" style="fill:white">3 · Combine</text><text x="48" y="377" class="small">Joins and row grain</text><text x="48" y="402" class="small">Subqueries and CTEs</text><text x="48" y="427" class="small">CASE, dates, strings</text><rect x="482" y="305" width="420" height="170" rx="12" fill="white" stroke="#cbd5e1"/><path d="M494,305h396q12,0 12,12v32H482V317q0,-12 12,-12" fill="#147a87"/